<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>25–40 岁职场人群饮茶认知与需求调研</title>
  <meta name="description" content="一份关于职场人群饮茶习惯、认知与内容需求的匿名调研，约 8 分钟。" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">茶</span>
      <span class="brand-text">饮茶认知与需求调研<small>TEA · WORKLIFE SURVEY</small></span>
    </div>
    <nav class="topnav">
      <span class="badge">V1.6 · 28 题 · 约 8 分钟</span>
      <a href="admin.html" class="admin-link">管理页</a>
    </nav>
  </header>

  <main class="page">
    <section id="intro" class="intro card">
      <div class="cup-icon" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="40" height="40">
          <path d="M20 25c0-5 5-6 5-11M31 25c0-5 5-6 5-11" fill="none" stroke="#c47c46" stroke-width="3" stroke-linecap="round"/>
          <path d="M15 28h31v13c0 8-6 14-14 14h-3c-8 0-14-6-14-14V28Z" fill="#35705a"/>
          <path d="M46 31h5c5 0 8 3 8 7s-3 7-8 7h-5" fill="none" stroke="#35705a" stroke-width="4" stroke-linecap="round"/>
          <path d="M19 33h23" stroke="#bcd5c7" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="intro-eyebrow">TEA STUDY · 一杯茶的调研</div>
      <h1>关于茶，想认真<br />听听你的想法</h1>
      <p class="intro-lead" id="introLead"></p>

      <button class="letter-card" id="letterCard" type="button" aria-label="查看来自我们的一封信">
        <div class="letter-preview"><img src="assets/who-we-are.png" alt="手写信件《我们是谁？》" /></div>
        <div class="letter-meta">
          <span class="letter-text"><strong>来自我们的一封信</strong><span>手写的一页，讲讲我们是谁、为什么认真做茶</span></span>
          <span class="letter-chevron" aria-hidden="true">›</span>
        </div>
      </button>

      <div class="rules-box">
        <div class="rules-title">开始前，三个小约定</div>
        <ol id="introRules"></ol>
      </div>
      <div class="privacy-note">匿名填写，只用于产品研究，不推销、不外传。问卷不计时，中间想改答案随时改。</div>
      <button class="btn btn-primary btn-lg" id="startBtn">开始填写 <span aria-hidden="true">→</span></button>
      <div class="intro-foot">谢谢你愿意花这 8 分钟。你的每一个选择，都会真的影响我们接下来做什么。</div>
    </section>

    <div id="letterModal" class="letter-modal hidden" role="dialog" aria-modal="true" aria-label="来自我们的一封信">
      <div class="letter-backdrop" id="letterBackdrop"></div>
      <div class="letter-modal-panel">
        <button class="letter-close" id="letterClose" type="button" aria-label="关闭">×</button>
        <img src="assets/who-we-are.png" alt="手写信件《我们是谁？》完整版" />
      </div>
    </div>

    <section id="survey" class="survey hidden">
      <div class="progress-wrap">
        <div class="progress-meta"><span id="progressSection">第一部分</span><span id="progressText">1 / 26</span></div>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      </div>
      <div class="card question-card" id="questionCard"></div>
      <div class="question-nav">
        <button class="btn btn-ghost" id="prevBtn">← 上一题</button>
        <button class="btn btn-primary" id="nextBtn">下一题 →</button>
      </div>
    </section>

    <section id="done" class="done card hidden">
      <div class="done-icon">✓</div>
      <h2>答卷已提交，谢谢你</h2>
      <p>你的答案会直接影响我们接下来做什么。</p>
      <div class="identity-card" id="identityCard"></div>
      <div class="receipt" id="receipt"></div>
      <button class="btn btn-ghost" id="againBtn">再填一份</button>
    </section>
  </main>

  <footer class="footer">茶值得被讲明白，也值得被喝明白。</footer>

  <script src="config.js"></script>
  <script src="questions.js"></script>
  <script src="cloud-cloudbase.js"></script>
  <script src="cloud.js"></script>
  <script src="identities.js"></script>
  <script src="app.js"></script>
</body>
</html>
